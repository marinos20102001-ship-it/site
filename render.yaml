# DM Accounting — Render.com Deployment Configuration
services:
  - type: web
    name: dm-accounting-backend
    runtime: python
    plan: starter  # $7/month — includes persistent disk
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false  # Set manually in Render dashboard
      - key: DB_NAME
        value: dm_accounting
      - key: JWT_SECRET
        generateValue: true  # Render will auto-generate a secure value
      - key: ADMIN_EMAIL
        value: marinosgr@yahoo.gr
      - key: ADMIN_PASSWORD
        sync: false  # Set manually (use a strong password!)
      - key: FRONTEND_URL
        sync: false  # e.g. https://dmaccounting.gr — set after frontend deploy
      - key: CORS_ORIGINS
        sync: false  # same as FRONTEND_URL
      - key: CLIENTS_DATA_DIR
        value: /var/data/clients-data
    disk:
      name: clients-data
      mountPath: /var/data
      sizeGB: 1
